<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="170" viewBox="0 0 1200 170"
     role="img" aria-labelledby="title desc">
  <title id="title">Idea Developer workflow</title>
  <desc id="desc">Three stages: start with a rough idea, interview one question at a time and probe weak spots, close with a filled one-page plan.</desc>

  <rect width="1200" height="170" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Rough idea -->
  <g transform="translate(64 44)">
    <text x="0" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="26" font-weight="700" fill="#e3b341">1 · Rough idea</text>
    <text x="0" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="20" fill="#9aa4b0">The half-formed thought,</text>
    <text x="0" y="94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="20" fill="#9aa4b0">no user or scope yet.</text>
  </g>

  <line x1="392" y1="60" x2="484" y2="60" stroke="#e3b341" stroke-width="2"/>
  <path d="M484 60 l-10 -6 v12 z" fill="#e3b341"/>

  <!-- Interview -->
  <g transform="translate(504 44)">
    <text x="0" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="26" font-weight="700" fill="#e3b341">2 · Interview</text>
    <text x="0" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="20" fill="#9aa4b0">One question at a time,</text>
    <text x="0" y="94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="20" fill="#9aa4b0">adapt, probe weak spots.</text>
  </g>

  <line x1="832" y1="60" x2="924" y2="60" stroke="#e3b341" stroke-width="2"/>
  <path d="M924 60 l-10 -6 v12 z" fill="#e3b341"/>

  <!-- One-page plan -->
  <g transform="translate(944 44)">
    <text x="0" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="26" font-weight="700" fill="#e3b341">3 · The plan</text>
    <text x="0" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="20" fill="#9aa4b0">Filled as we talk,</text>
    <text x="0" y="94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="20" fill="#9aa4b0">ready to start on.</text>
  </g>
</svg>
