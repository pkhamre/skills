<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="170" viewBox="0 0 1200 170"
     role="img" aria-labelledby="title desc">
  <title id="title">Session Handoff lifecycle</title>
  <desc id="desc">Three phases: start reads the docs and orients, during keeps them in sync, end writes state back down.</desc>

  <rect width="1200" height="170" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Start -->
  <g transform="translate(64 44)">
    <text x="0" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="26" font-weight="700" fill="#e3b341">1 · Start</text>
    <text x="0" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="20" fill="#9aa4b0">Load the docs, orient,</text>
    <text x="0" y="94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="20" fill="#9aa4b0">propose the next step.</text>
  </g>

  <line x1="392" y1="60" x2="484" y2="60" stroke="#e3b341" stroke-width="2"/>
  <path d="M484 60 l-10 -6 v12 z" fill="#e3b341"/>

  <!-- During -->
  <g transform="translate(504 44)">
    <text x="0" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="26" font-weight="700" fill="#e3b341">2 · During</text>
    <text x="0" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="20" fill="#9aa4b0">HANDOFF, DECISIONS,</text>
    <text x="0" y="94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="20" fill="#9aa4b0">RUNBOOK stay current.</text>
  </g>

  <line x1="832" y1="60" x2="924" y2="60" stroke="#e3b341" stroke-width="2"/>
  <path d="M924 60 l-10 -6 v12 z" fill="#e3b341"/>

  <!-- End -->
  <g transform="translate(944 44)">
    <text x="0" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="26" font-weight="700" fill="#e3b341">3 · End</text>
    <text x="0" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="20" fill="#9aa4b0">Write state back,</text>
    <text x="0" y="94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="20" fill="#9aa4b0">log, check secrets.</text>
  </g>
</svg>
